@keyframes assetFadeIn {
   from { opacity: 0; transform: perspective(400px) rotateX(-14deg) rotateY(14deg) scale(0.82); }
   65% { opacity: 1; transform: perspective(400px) rotateX(-2deg) rotateY(2deg) scale(1.08); }
   to { opacity: 1; transform: perspective(400px) rotateX(0) rotateY(0) scale(1); }
}
@keyframes workspacePulse {

.conversationEntering fg-mainview.currentConvo > fg-mainviewtop,

/* styles/genbox.css */
/* genbox — image generation placeholder
   everything is scoped under .genbox. recolour via the custom properties below. */

.genbox {
   /* ---- palette ---- */
   --gb-1: #4f6bff; /* blue    */
   --gb-2: #8b5cf6; /* violet  */
   --gb-3: #22d3ee; /* cyan    */
   --gb-4: #c026d3; /* magenta */
   --gb-plate: #0e0c16; /* box fill */
   --gb-radius: 20px;
   --gb-ratio: 4/5;
   --gb-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;

   position: relative;
   width: 100%;
   aspect-ratio: var(--gb-ratio);
   border-radius: var(--gb-radius);
   overflow: hidden;
   isolation: isolate;
   background: var(--gb-plate);
   border: 1px solid #ffffff12;
   box-shadow: 0 20px 50px -24px #4f6bff55;
}
/* ---- 1. drifting glow ---- */
.genbox-glow {
   position: absolute;
   inset: -30%;
   filter: blur(46px);
   pointer-events: none;
}
.genbox-blob {
   position: absolute;
   border-radius: 50%;
   mix-blend-mode: screen;
   will-change: transform;
}
.genbox-b1 {
   width: 95%;
   height: 60%;
   left: -18%;
   bottom: -10%;
   background: radial-gradient(circle, var(--gb-1) 0%, #4f6bff00 68%);
   animation: gb-d1 17s ease-in-out infinite;
}
.genbox-b2 {
   width: 85%;
   height: 55%;
   right: -16%;
   bottom: -6%;
   background: radial-gradient(circle, var(--gb-3) 0%, #22d3ee00 66%);
   animation: gb-d2 21s ease-in-out infinite;
}
.genbox-b3 {
   width: 70%;
   height: 44%;
   left: 12%;
   bottom: 4%;
   background: radial-gradient(circle, var(--gb-2) 0%, #8b5cf600 64%);
   animation: gb-d3 13s ease-in-out infinite;
}
.genbox-b4 {
   width: 130%;
   height: 30%;
   left: -14%;
   top: -14%;
   background: radial-gradient(
      ellipse at 50% 100%,
      var(--gb-2) 0%,
      #8b5cf600 70%
   );
   animation: gb-d4 19s ease-in-out infinite;
}
.genbox-b5 {
   width: 45%;
   height: 38%;
   left: -12%;
   bottom: 22%;
   background: radial-gradient(circle, var(--gb-4) 0%, #c026d300 65%);
   animation: gb-d2 25s ease-in-out infinite reverse;
}
@keyframes gb-d1 {
   0%,
   100% {
      transform: translate3d(0, 0, 0) scale(1);
   }
   33% {
      transform: translate3d(9%, -6%, 0) scale(1.15);
   }
   66% {
      transform: translate3d(-6%, 4%, 0) scale(0.92);
   }
}
@keyframes gb-d2 {
   0%,
   100% {
      transform: translate3d(0, 0, 0) scale(1.05);
   }
   40% {
      transform: translate3d(-11%, -8%, 0) scale(0.9);
   }
   70% {
      transform: translate3d(5%, 3%, 0) scale(1.2);
   }
}
@keyframes gb-d3 {
   0%,
   100% {
      transform: translate3d(0, 0, 0) scale(0.95);
   }
   50% {
      transform: translate3d(14%, -10%, 0) scale(1.25);
   }
}
@keyframes gb-d4 {
   0%,
   100% {
      transform: translate3d(-4%, 0, 0) scale(1);
   }
   50% {
      transform: translate3d(6%, 2%, 0) scale(1.1);
   }
}
</style>
