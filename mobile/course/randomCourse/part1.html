/* styles/base.css */
html:not(.forge-motion-ready),
html:not(.forge-motion-ready) *,
html:not(.forge-motion-ready) *::before,
html:not(.forge-motion-ready) *::after {
   animation: none !important;
   transition: none !important;
}
* {
   font-family: "Atkinson Hyperlegible Next", sans-serif;
   font-optical-sizing: auto;
   transition-property:
      color,
      background-color,
      border-color,
      outline-color,
      opacity,
      transform,
      translate,
      scale,
      box-shadow,
      width,
      height,
      max-height,
      padding,
      margin,
      gap;
   transition-duration: 0.25s;
   transition-timing-function: ease;
}
body {
   background: #0a0a0a;
   --Glass-Text: linear-gradient(
      180deg,
      #fff 0%,
      rgba(255, 255, 255, 0.5) 100%
   );

   &.chat {
      display: flex;
      height: 100vh;
      width: 100vw;
      padding: 10px 0 0 10px;
      margin: 0;
      box-sizing: border-box;
      align-items: flex-start;
      gap: 10px;
   }
}
fg-sidebar {
   user-select: none;
   -webkit-user-drag: none;
   overflow-y: scroll;
   display: flex;
   width: 305px;
   padding: calc(10px + 62px + 15px) 10px 440px 10px;
   flex-direction: column;
   align-items: flex-start;
   gap: 15px;
   flex-shrink: 0;
   align-self: stretch;
   position: relative;

   &.collapsed {
      width: 60px;
      padding-bottom: 20px;
      fg-top.sb {
         width: 60px;
         .fgLogo {
            display: none;
         }
      }
      .sidebarElem {
         color: #ffffff00;
         width: 60px;
         height: 60px;
      }
      fg-toplabel {
         display: none;
      }
      fg-bottom {
         display: none !important;
      }
   }

   fg-top.sb {
      display: flex;
      position: fixed;
      top: 20px;
      left: 20px;
      right: 10px;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      box-sizing: border-box;
      width: 305px;

      .fgLogo {
         height: 24px;
      }
      button {
         border: none;
         background: none;
         width: 38px;
         height: 38px;
         border-radius: 1293px;
         display: flex;
         align-items: center;
         justify-content: center;
         &:hover {
            background-color: rgba(255, 255, 255, 0.05);
            outline: solid 10px rgba(255, 255, 255, 0.05);
         }
         &:active {
            transform: scale(0.9);
         }
      }
   }

   fg-specialtabs {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      align-self: stretch;
   }

   fg-projects {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      flex: 1 0 0;
      align-self: stretch;

      fg-toplabel {
         display: flex;
         margin: 14px 15px;
         align-items: center;
         gap: 8px;
         align-self: stretch;
         color: #fff;
         font-size: 20px;
         font-weight: 500;
      }
   }

   .conversationListStatus {
      padding: 8px 15px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
      line-height: 1.35;
   }

   .conversationEntry span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
   }

   .sidebarElem {
      text-decoration: none;
      display: flex;
      padding: 8px 10px;
      align-items: center;
      gap: 8px;
      align-self: stretch;
      border-radius: 15px;
      color: white;
      font-size: 20px;
      font-weight: 500;
      width: 100%;
      box-sizing: border-box;

      &.selected {
         border: 1px solid rgba(255, 255, 255, 0.2);
         background: rgba(60, 60, 60, 0.2);
      }
      &:hover {
         background-color: rgba(255, 255, 255, 0.05);
      }

      img {
         width: 28px;
         height: 28px;
         margin: 5px;
      }
   }

   fg-bottom.sb {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      align-self: stretch;
      box-sizing: border-box;
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 12931823;
      backdrop-filter: blur(20px);
      border-radius: 15px;
      width: 305px;
      fg-actions {
         width: 100%;
      }
      creditCounter {
         box-sizing: border-box;
         display: flex;
         padding: 10px;
         flex-direction: column;
         align-items: flex-start;
         gap: 10px;
         align-self: stretch;
         border-radius: 15px;
         border: 1px solid rgba(255, 255, 255, 0.12);
         width: 100%;

         fg-top {
            display: flex;
            padding: 5px 8px;
            justify-content: space-between;
            align-items: center;
            align-self: stretch;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            font-size: 18px;
            font-weight: 400;
            gap: 8px;

            a {
               color: #fff;
               text-decoration: none;
               font-size: 18px;
               font-weight: 600;
            }
         }
         fg-bottom {
            display: flex;
            flex-direction: row;
            padding: 8px;
            justify-content: center;
            align-items: center;
            gap: 15px;
            align-self: stretch;
         }
         creditSlider {
            height: 9px;
            flex: 1 0 0;
            background-color: rgba(255, 255, 255, 0.1);
            width: 100%;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            &::before {
               content: "";
               width: 100px;
               display: flex;
               height: 9px;
               background: linear-gradient(0deg, #0084ff 0%, #0084ff 100%);
            }
         }
      }

      fg-sidebaruserbutton {
         display: flex;
         padding: 15px;
         align-items: center;
         gap: 10px;
         align-self: stretch;
         border-radius: 15px;
         border: 1px solid rgba(255, 255, 255, 0.12);
         user-select: none;

         fg-vertical {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            height: 34px;
            width: 100%;

            b {
               color: #fff;
               font-size: 20px;
               font-weight: 600;
               line-height: 20px;
            }

            span {
               color: rgba(255, 255, 255, 0.8);
               font-size: 16px;
               font-weight: 400;
               line-height: normal;
            }
         }

         img {
            width: 38px;
            height: 38px;
            border-radius: 38px;
         }

         &:hover {
            background-color: rgba(255, 255, 255, 0.05);
         }
      }
   }
}
.upgradeButton {
   display: flex;
   align-items: center;
   justify-content: center;
   gap: 10px;
   padding: 12px 20px;
   background: #0077ff;
   border: none;
   border-radius: 15px;
   cursor: pointer;
   position: relative;

   &:hover {
      background-color: #32a3ff !important;
   }

   &.selected {
      background-color: #32a3ff !important;
   }

   &::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0px 2px 2px 0px rgba(255, 255, 255, 0.59);
      pointer-events: none;
   }

   span {
      font-weight: bold;
      font-size: 20px;
      white-space: nowrap;
      background: linear-gradient(to bottom, #ffffff, rgba(255, 255, 255, 0.5));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0px 1px 1.4px rgba(0, 0, 0, 0.25));
   }
}
fg-mainview {
   display: flex;
   flex-direction: column;
   align-items: center;
   box-sizing: border-box;
   flex: 1 0 0;
   height: 100%;
   overflow-y: scroll;
   border-radius: 20px 0 0 0;
   border-top: 1px solid #333;
   border-left: 1px solid #333;
   background: #161616;
   h1 {
      margin: 0;
   }
}
/* styles/course-player.css */
/* Page-specific styles extracted from base.css. */

/* ── Course player page ─────────────────────────────────────────── */
fg-mainview.courses:has(fg-courseplayer) {
   align-items: stretch;
   overflow: hidden;
   padding: 0;

   fg-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 40px;
      padding: 30px 35px 0;
      flex-shrink: 0;
   }

   fg-breadcrumb {
      display: flex;
      align-items: center;
      gap: 10px;

      span {
         font-size: 32px;
         font-weight: 500;
         color: rgba(255, 255, 255, 0.8);
      }

      b {
         font-size: 32px;
         font-weight: 600;
         color: #fff;
      }

      img {
         width: 24px;
         height: 24px;
      }
   }

   fg-courseplayer {
      flex: 1;
      min-height: 0;
      margin: 20px 35px 0;
      border: 1px solid #363636;
      border-radius: 10px;
      overflow: hidden;
      background: url("../../../assets/coursePlaceholder.jpg") center / cover no-repeat;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;

      &::before {
         content: "";
         position: absolute;
         inset: 0;
         background: rgba(0, 0, 0, 0.6);
         pointer-events: none;
      }

      h1 {
         font-size: 32px;
         font-weight: 600;
         color: #fff;
         margin: 0;
         position: relative;
         z-index: 1;
      }

      h2 {
         font-size: 24px;
         font-weight: 500;
         color: rgba(255, 255, 255, 0.7);
         margin: 0;
         position: relative;
         z-index: 1;
      }

      > span {
         font-size: 18px;
         font-weight: 500;
         color: rgba(255, 255, 255, 0.7);
         position: relative;
         z-index: 1;
      }

      .coursePlayerInfo {
         display: flex;
         flex-direction: column;
         align-items: center;
         gap: 4px;
         position: relative;
         z-index: 1;
      }
   }

   .playButton {
      width: 81px;
      height: 81px;
      border-radius: 50px;
      backdrop-filter: blur(25px);
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      z-index: 1;

      img {
         width: 61px;
         height: 61px;
      }
   }

   fg-bottom {
      height: 109px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex-shrink: 0;

      fg-completionbar {
         width: 529px;
      }
   }
}
.courseSwitchButton {
   width: 58px;
   height: 58px;
   border-radius: 36px;
   backdrop-filter: blur(17.9px);
   background: rgba(255, 255, 255, 0.16);
   border: 0.716px solid rgba(255, 255, 255, 0.2);
   display: flex;
   align-items: center;
   justify-content: center;
   cursor: pointer;
   flex-shrink: 0;

   img {
      width: 32px;
      height: 32px;
   }

   &.active {
      background: #0077ff;
      box-shadow: inset 0px 2px 2px 0px rgba(255, 255, 255, 0.59);
   }
}
</style>

        </a>

    <fg-contextmenu

            <img src="../../../icons/SignOut.svg" alt="" /> Logout

        <a
            href="../../../plans.html"
            class="sidebarElem upgradeButton"

                src="../../../icons/crown.svg"

            />

        <fg-sidebaruserbutton data-context-target="userMenu">

                <b data-user-name>Creator</b>

            </fg-vertical>

</fg-sidebar>

                    <img src="../../../icons/arrow.svg" style="rotate: -90deg" />
                </button>
            </fg-bottom>
        </fg-mainview>
    </body>
