<!doctype html>
<html lang="en">
    <head>

        <link rel="stylesheet" href="base.css" />
        <link rel="stylesheet" href="plans.css" />
        <script src="site.js" defer></script>
        <meta name="theme-color" content="#0D0D0D" />
        <meta name="description" content="ForgeGUI - Create anything with AI" />
        <meta property="og:title" content="ForgeGUI" />

            property="og:description"

    <body class="chat">
        <slot template="templates/app-shell.html">
            <mainView slot="content" class="courses">

                    >

                </banner>
                <courseHeader> Available Courses </courseHeader>
                <courseGrid>
                    <slot template="templates/course.html"> </slot>
                    <slot template="templates/course.html"> </slot>
                    <slot template="templates/course.html"> </slot>
                    <slot template="templates/course.html"> </slot>
                    <slot template="templates/course.html"> </slot>
                    <slot template="templates/course.html"> </slot>
                    <slot template="templates/course.html"> </slot>
                    <slot template="templates/course.html"> </slot>
                    <slot template="templates/course.html"> </slot>
                </courseGrid>
                <completionBarBG>
                    <completionBar>
                        <meat> <b>25%</b><span>Complete</span> </meat>
                    </completionBar>
                </completionBarBG>
            </mainView>
        </slot>
    </body>
</html>
