        <div class="sidebarBottom">
            <button class="sidebarUserInfo" onclick="showUserPopup(event)">
                <div class="modelPickerPopup hidden" id="userPicker">
                    <a href="settings/accountOverview.html" class="modelOption style">
                        <img src="modePickerIcons/Settings.svg" style="height: 28px;">
                        <div class="stylePickerText">
                            <b>Settings</b>
                            <span>Change your account settings.</span>
                        </div>
                    </a>
                    <div class="modelOption style">
                        <img src="modePickerIcons/X.svg" style="height: 28px;">
                        <div class="stylePickerText">
                            <b>Log Out</b>
                            <span>Exit your session.</span>
                        </div>
                    </div>
                </div>

                <div class="userInfo">
                    <div class="userProfile">
                        <img style="height: 40px; border-radius: 50%;" src="doromiert.png" alt="doromiert">
                        <div class="doxx"><span style="font-size: 20px; font-weight: 600;">doromiert</span><span

                    </div>

    <div class="mainView">
        <div class="topBar">
            <img src="bigIcons/Message.svg">
            <span>New Chat</span>
            <div style="flex: 1;"></div>
            <img src="bigIcons/3Dots.svg">
        </div>
        <div class="chatScrollView">
            <div class="message you">This is a user created message</div>
            <div class="message">Generating your asset...</div>
            <div class="WIPImage">
                <div class="WILayer2">
                    <img src="smallIcons/AI.svg" style="height: 76px;">
                    <span>Sit back and wait while we do the magic...</span>
                </div>
            </div>

        </div>
        <div class="chatbox floating">

            <textarea class="chatboxProper" placeholder="Describe what you wish to create."></textarea>
            <div class="textboxUnder">
                <button class="addMediaButton">
                    <img src="smallIcons/Add.svg">
                </button>
                <button class="outputTypePicker" onclick="toggleTypePopup(event)">
                    <div class="modelPickerPopup hidden" id="outputTypePicker">
                        <div class="modelOption style">
                            <img src="modePickerIcons/thumb.svg" style="height: 28px;">
                            <div class="stylePickerText">
                                <b>Thumbnail</b>
                                <span>Generate thumbnails for your projects.</span>
                            </div>
                        </div>
                        <div class="modelOption style">
                            <img src="modePickerIcons/Icons.svg" style="height: 28px;">
                            <div class="stylePickerText">
                                <b>Icon</b>
                                <span>Generate icons for your projects.</span>
                            </div>
                        </div>
                        <div class="modelOption style">
                            <img src="modePickerIcons/GUI.svg" style="height: 28px;">
                            <div class="stylePickerText">
                                <b>GUI</b>
                                <span>Generate high-quality GUI assets</span>
                            </div>
                        </div>
                        <div class="modelOption style">
                            <img src="modePickerIcons/3d.svg" style="height: 28px;">
                            <div class="stylePickerText">
                                <b>3D</b>
                                <span>Generate 3D objects</span>
                            </div>
                        </div>
                        <div class="modelOption style">
                            <img src="modePickerIcons/Music.svg" style="height: 28px;">
                            <div class="stylePickerText">
                                <b>Music</b>
                                <span>Generate music for your projects.</span>
                            </div>
                        </div>
                        <div class="modelOption style">
                            <img src="modePickerIcons/AudioWave.svg" style="height: 28px;">
                            <div class="stylePickerText">
                                <b>SFX</b>
                                <span>Generate high-quality SFX</span>
                            </div>
                        </div>
                    </div>
                    <img src="smallIcons/Image.svg">
                    <span>Image</span>
                    <img src="smallIcons/Chevron.svg">
                </button>
                <button class="modelPicker" onclick="showModelPicker(event)">
                    <img src="smallIcons/AI.svg">
                    <span>Yunes <span class="modelVersion">MAX</span></span>
                    <img src="smallIcons/Chevron.svg">
                    <div class="modelPickerPopup hidden" id="modelPickerPopup">
                        <div class="modelOption">
                            <img src="aiModels/nanobanana.svg">
                            <div class="modelDetails">
                                <span class="modelName">Nano Banana Pro <div style="width: min-content;"
                                        class="shapeChip">NEW</div></span>
                                <span class="modelDesc">
                                    Premium quality; deep visual reasoning, native 4K output, and strict multi-image
                                    character consistency.
                                </span>
                                <div class="modelTags">
                                    <div class="modelTag">Creative</div>
                                    <div class="modelTag" style="background-color: #00A1B3;">Customizable</div>
                                </div>
                                <div class="modelCreditCost">
                                    <img src="smallIcons/AI.svg">
                                    <span>3 Credits</span>
                                </div>
                            </div>
                        </div>
                        <div class="modelOption">
                            <img src="aiModels/gpti2.svg">
                            <div class="modelDetails">
                                <span class="modelName">GPT Image 2</span>
                                <span class="modelDesc">
                                    High-accuracy multimodal; exceptional text rendering, precise regional editing, and
                                    complex prompt adherence.
                                </span>
                                <div class="modelTags">
                                    <div class="modelTag">Creative</div>
                                    <div class="modelTag" style="background-color: #00A1B3;">Customizable</div>
                                </div>
                                <div class="modelCreditCost">
                                    <img src="smallIcons/AI.svg">
                                    <span>3 Credits</span>
                                </div>
                            </div>
                        </div>
                        <div class="modelOption">
                            <img src="aiModels/meshy.svg">
                            <div class="modelDetails">
                                <span class="modelName">Meshy</span>
                                <span class="modelDesc">
                                    AI 3D generation; rapid text/image-to-3D asset creation, automated PBR texturing,
                                    and game-ready mesh generation.
                                </span>
                                <div class="modelTags">
                                    <div class="modelTag">Creative</div>
                                    <div class="modelTag" style="background-color: #00A1B3;">Customizable</div>
                                </div>
                                <div class="modelCreditCost">
                                    <img src="smallIcons/AI.svg">
                                    <span>3 Credits</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </button>
                <hr>
                <button class="gamePicker" onclick="toggleStylePicker(event)">
                    <div class="modelPickerPopup hidden" id="stylePicker">
                        <div class="modelOption style">
                            <img src="modePickerIcons/RobloxLogo.svg" style="height: 28px;">
                            <div class="stylePickerText">
                                <b>Roblox</b>
                                <span>Stylized like Roblox</span>
                            </div>
                        </div>
                        <div class="modelOption style">
                            <img src="modePickerIcons/UnrealEngine.svg" style="height: 28px;">
                            <div class="stylePickerText">
                                <b>Fortnite</b>
                                <span>Stylized like Fortnite</span>
                            </div>
                        </div>
                        <div class="modelOption style">
                            <img src="modePickerIcons/thumb.svg" style="height: 28px;">
                            <div class="stylePickerText">
                                <b>Realistic</b>
                                <span>Generic style, easily customizable.</span>
                            </div>
                        </div>
                        <div class="modelOption style">
                            <img src="modePickerIcons/Pencil.svg" style="height: 28px;">
                            <div class="stylePickerText">
                                <b>General</b>
                                <span>Generic style, easily customizable.</span>
                            </div>
                        </div>
                    </div>
                    <img src="smallIcons/Pencil.svg">
                    <span>Roblox</span>
                    <img src="smallIcons/Chevron.svg">
                </button>
                <hr>
                <div style="flex: 1;"></div>
                <button class="sendButton">
                    <img src="smallIcons/Send.svg">
                </button>
            </div>
        </div>
    </div>

</body>
<script>
    function toggleSidebar() {
        document.querySelector('.sidebar').classList.toggle('collapsed');
    }
    function showModelPicker() {
        document.querySelector('#modelPickerPopup').classList.toggle('hidden');
    }
    function toggleStylePicker() {
        document.querySelector('#stylePicker').classList.toggle('hidden');
    }
    function toggleTypePopup() {
        document.querySelector('#outputTypePicker').classList.toggle('hidden');
    }
    function showUserPopup() {
        document.querySelector('#userPicker').classList.toggle('hidden');
    }
</script>
