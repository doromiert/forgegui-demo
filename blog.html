<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ForgeGUI Blog</title>
        <meta name="description" content="News and updates from ForgeGUI." />
        <meta name="theme-color" content="#0a0a0a" />
        <meta name="color-scheme" content="dark" />
        <link rel="stylesheet" href="public.css" />
        <link rel="stylesheet" href="blog.css" />
        <script src="site.js" defer></script>
        <script src="public-pages.js" defer></script>
    </head>
    <body class="publicPage">
        <fg-include data-template="templates/public-header.html"></fg-include>
        <main class="publicSurface">
            <fg-include data-template="templates/public-hero.html">
                <span data-slot="title">Blog</span>
                <span data-slot="description">Learn about what’s going on inside ForgeGUI!</span>
                <img data-slot="mark" class="publicHeroMark" src="landing-assets/public-mark-blog.svg" alt="" />
            </fg-include>

            <section class="blogListing" aria-labelledby="latest-news-title">
                <div class="publicSectionHeader">
                    <h2 id="latest-news-title">Latest News</h2>
                    <label class="publicSearch">
                        <img src="icons/search.svg" alt="" />
                        <span class="visually-hidden">Search news</span>
                        <input type="search" placeholder="Search" data-list-search data-list-target="blog-grid" />
                    </label>
                </div>
                <div class="blogGrid" id="blog-grid">
                    <fg-include data-template="templates/blog-card.html"></fg-include>
                    <fg-include data-template="templates/blog-card.html"></fg-include>
                    <fg-include data-template="templates/blog-card.html"></fg-include>
                    <fg-include data-template="templates/blog-card.html"></fg-include>
                    <fg-include data-template="templates/blog-card.html"></fg-include>
                    <fg-include data-template="templates/blog-card.html"></fg-include>
                    <fg-include data-template="templates/blog-card.html"></fg-include>
                    <fg-include data-template="templates/blog-card.html"></fg-include>
                    <fg-include data-template="templates/blog-card.html"></fg-include>
                    <fg-include data-template="templates/blog-card.html"></fg-include>
                    <fg-include data-template="templates/blog-card.html"></fg-include>
                    <fg-include data-template="templates/blog-card.html"></fg-include>
                </div>
                <p class="publicEmptyFilter" data-list-empty hidden>No news matches your search.</p>
            </section>
        </main>
    </body>
</html>
