    <style>
        .assetView {
            width: 100%;
            height: 100%;
            align-items: center;
            display: flex;
            justify-content: center;
            background-color: #0F0F0F;
        }

        .assetSidebar {
            max-width: 458px;
            height: 100%;
            outline: solid;
            outline-width: 1px;
            outline-color: rgba(255, 255, 255, 0.15);

            display: flex;
            flex-direction: column;
            padding: 30px;
            gap: 30px;
            box-sizing: border-box;
        }

        .mainView {
            flex-direction: row;
            overflow: hidden;
            gap: 0px;
        }

        .sbt {
            display: flex;
            gap: 17px;
            align-items: center;
            font-size: 28px;
            font-weight: 600;
        }

        .assetTags {
            display: flex;
            gap: 8px;

            .assetTag {
                height: 32px;
                border-radius: 10px;
                background-color: #313131;
                color: white;
                padding: 10px;
                box-sizing: border-box;
                align-items: center;
                display: flex;

                &.active {
                    background-color: #2258A9;
                }
            }

            flex-wrap: wrap;
            width: 100%;
        }

        .assetInfo {
            h1 {
                margin: 0 !important;
            }

            gap: 24px;

            span {
                display: flex;

                img {
                    width: 26px;
                    border-radius: 21px;
                }

                gap: 8px;
                align-items: center;
                font-size: 24px;
                font-weight: 600;
            }
        }

        .assetActions {
            display: flex;
            gap: 15px;
        }

        .assetAction {
            display: flex;
            border: none;
            background-color: #313131;
            padding: 15px;
            border-radius: 2137px;
            gap: 15px;
            font-size: 24px;
            font-weight: 600;

            span {
                margin-right: 5px;
            }

            outline: solid;
            outline-width: 1px;
            outline-offset: -1px;
            outline-color: rgba(255, 255, 255, 0.1);

            &.active {
                background-color: #2258A9;
            }
        }
    </style>

</head>

<script>
    function toggleSidebar() {

    }
    function showModelPicker() {
        document.querySelector('#modelPickerPopup').classList.toggle('hidden');
    }
    function toggleStylePicker() {
        document.querySelector('#stylePicker').classList.toggle('hidden');
    }
    function toggleTypePopup() {

    function showUserPopup() {
