<fg-asset
    data-popup-open="asset-preview"
    role="button"
    tabindex="0"
    aria-haspopup="dialog"
>
    <fg-slot data-name="image"></fg-slot>
    <fg-bottom>
        <fg-vertical>
            <b><fg-slot data-name="title">Asset Name</fg-slot></b>
            <span><fg-slot data-name="date">Generated Yesterday</fg-slot></span>
        </fg-vertical>
        <img src="icons/3dots.svg" alt="" />
    </fg-bottom>
</fg-asset>
