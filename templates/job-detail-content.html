<div class="jobDetailInner">
    <fg-top class="jobDetailTitlebar">
        <button class="jobDetailBack" type="button" data-popup-close aria-label="Close job details">
            <img src="icons/arrow.svg" alt="" />
        </button>
        <span>Job Role</span>
        <img class="jobDetailMore" src="icons/3dots.svg" alt="" />
    </fg-top>

    <div class="jobDetailBanner">
        <img src="assets/landing/job-banner-base.jpg" alt="Abstract blue geometric forms" />
        <img src="assets/landing/job-banner-overlay.png" alt="" />
    </div>

    <header class="jobDetailHeader">
        <span class="jobDetailIcon" aria-hidden="true">
            <img class="jobIconLeft" src="assets/landing/job-icon-left.svg" alt="" />
            <img class="jobIconCenter" src="assets/landing/job-icon-center.svg" alt="" />
            <img class="jobIconRight" src="assets/landing/job-icon-right.svg" alt="" />
        </span>
        <span class="jobDetailHeading">
            <strong>Job Role</strong>
            <span>Category</span>
        </span>
        <a class="jobApplyButton" href="mailto:careers@forgegui.com?subject=Job%20Role%20Application">
            Email to Apply
            <span class="jobMailIcon" aria-hidden="true">
                <img src="assets/landing/mail-outline.svg" alt="" />
            </span>
        </a>
    </header>

    <div class="jobDetailBody">
        <section class="jobDescription" aria-labelledby="job-description-title">
            <h2 id="job-description-title">Job Description</h2>
        </section>
        <aside class="jobRequirements">
            <h2>Requirements</h2>
            <ul>
                <li>Qualification 1</li>
                <li>Qualification 2</li>
                <li>Qualification 3</li>
            </ul>
        </aside>
    </div>
</div>
