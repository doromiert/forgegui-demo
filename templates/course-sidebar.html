<fg-sidebar>
    <fg-top class="sb">
        <img src="assets/course-fg.svg" class="fgLogo" alt="ForgeGUI" />
        <button type="button" data-toggle-sidebar aria-label="Toggle sidebar">
            <img src="icons/sidebar.svg" alt="" />
        </button>
    </fg-top>

    <fg-specialtabs>
        <a href="courses.html" class="sidebarElem" data-route="courses.html">
            <img src="icons/arrow.svg" alt="" style="rotate: 90deg" />
            <span>Back to Courses</span>
        </a>
    </fg-specialtabs>

    <fg-projects>
        <a href="course/randomCourse/part1.html" class="sidebarElem">
            <img src="icons/Play.svg" alt="" />
            <span>Part 1</span>
        </a>
    </fg-projects>

    <fg-contextmenu
        id="userMenu"
        class="hidden user"
        style="width: 282px"
    >
        <button><img src="icons/Exclamation.svg" alt="" /> Help</button>
        <a href="settings/overview.html"
            ><img src="icons/Settings.svg" alt="" /> Settings</a
        >

        <button class="destructive" data-auth-signout>
            <img src="icons/SignOut.svg" alt="" /> Logout
        </button>
    </fg-contextmenu>

    <fg-bottom class="sb">
        <a
            href="plans.html"
            class="sidebarElem upgradeButton"
            data-route="plans.html"
        >
            <img
                src="icons/crown.svg"
                alt=""
                style="image-rendering: optimizeQuality"
            />
            <span>Upgrade to Pro</span>
        </a>

        <fg-sidebaruserbutton data-context-target="userMenu">
            <img src="assets/generic.png" alt="" data-user-avatar />
            <fg-vertical>
                <b data-user-name>Creator</b>
                <span data-user-email></span>
            </fg-vertical>
            <img src="icons/selection.svg" alt="" />
        </fg-sidebaruserbutton>
    </fg-bottom>
</fg-sidebar>
