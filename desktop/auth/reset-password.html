/* styles/auth-pages.css */
body.auth-page {
  min-height: 100vh;
  margin: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  background: radial-gradient(circle at 50% 20%, rgba(0, 119, 255, 0.2), transparent 38%), #080808;
  color: #fff;
  font-family: Inter, system-ui, sans-serif;
}
.auth-page-panel {
  width: min(430px, 100%);
  padding: 32px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 24px;
  background: rgba(13, 13, 13, 0.96);
  box-shadow: 0 30px 100px rgba(0, 0, 0, 0.6);
  text-align: center;
}
.auth-page-panel img {
  width: 150px;
  max-height: 42px;
  object-fit: contain;
}
.auth-page-panel h1 {
  margin: 24px 0 8px;
}
.auth-page-panel p {
  color: rgba(255, 255, 255, 0.72);
}
.auth-page-form {
  display: grid;
  margin-top: 24px;
  gap: 12px;
}
.auth-page-form input,
.auth-page-form button {
  min-height: 48px;
  padding: 0 16px;
  border-radius: 12px;
  color: #fff;
  font: inherit;
}
.auth-page-form input {
  border: 1px solid #303030;
  background: #1d1d1d;
}
.auth-page-form button {
  border: 0;
  background: #0077ff;
  cursor: pointer;
  font-weight: 700;
}
.auth-page-status {
  min-height: 24px;
  color: #ff8f8f !important;
}
.auth-page-status.success {
  color: #86efac !important;
}
</style>
    <link rel="stylesheet" href="../../styles/auth-pages.css" />
    <script src="../../scripts/reset-password.js" defer></script>
  </head>
  <body class="auth-page">
    <main class="auth-page-panel">
      <img src="../../assets/footerLogo.svg" alt="ForgeGUI" />
      <h1>Set a new password</h1>
      <p>Choose a new password for your ForgeGUI account.</p>
      <form class="auth-page-form" data-reset-password-form>
        <input type="password" name="password" minlength="8" placeholder="New password" required />
        <input type="password" name="confirmPassword" minlength="8" placeholder="Confirm password" required />
        <button type="submit">Update password</button>
        <p class="auth-page-status" data-reset-password-status role="status"></p>
      </form>
    </main>
  </body>
