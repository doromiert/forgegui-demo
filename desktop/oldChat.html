<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat - ForgeGUI</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/old-chat.css" />
    <script src="scripts/site.js" defer></script>
    <meta name="theme-color" content="#0D0D0D" />
    <meta name="description" content="ForgeGUI conversation workspace" />
    <meta name="color-scheme" content="dark" />
  </head>
  <body class="chat">
    <fg-include data-template="templates/app-shell.html">
      <fg-mainview class="currentConvo" data-slot="content">
        <header>
          <img src="icons/message.svg" alt="" />
          <span>Chat</span>
        </header>
        <fg-mainviewtop>
          <fg-chatcontainer>
            <fg-top><img src="icons/assets.svg" alt="" /><span>Generated Assets</span></fg-top>
            <fg-bottom class="assetGrid" data-chat-assets>
              <p class="workspaceEmpty">Loading assets...</p>
            </fg-bottom>
          </fg-chatcontainer>
          <fg-chatcontainer class="convo">
            <fg-top><img src="icons/message.svg" alt="" /><span data-chat-title>Conversation</span></fg-top>
            <fg-bottom class="convo workspaceMessages" data-chat-messages aria-live="polite">
              <p class="workspaceEmpty">Loading conversation...</p>
            </fg-bottom>
          </fg-chatcontainer>
        </fg-mainviewtop>
        <fg-bottom>
          <fg-include data-template="templates/chatbox.html"></fg-include>
        </fg-bottom>
      </fg-mainview>
    </fg-include>
  </body>
</html>
