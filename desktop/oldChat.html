          <fg-chatcontainer class="convo">
            <fg-top>
              <img src="icons/message.svg" />
              <span>Conversation</span>
            </fg-top>
            <fg-bottom class="convo">
              <fg-message class="you"> my message </fg-message>
              <fg-message
                ><fg-msgtop><img src="icons/ai.svg" /><span>Yunes</span></fg-msgtop>
                clanker message
              </fg-message>
              <fg-message class="you"> my message </fg-message>
              <fg-message
                ><fg-msgtop><img src="icons/ai.svg" /><span>Yunes</span></fg-msgtop>
                clanker message <br /><img src="icons/3dots.svg" />
                <div id="slot" class="genbox" data-genbox></div
              ></fg-message>
            </fg-bottom>
          </fg-chatcontainer>
        </fg-mainviewtop>
        <fg-bottom>
          <fg-include data-template="templates/chatbox.html"></fg-include>
        </fg-bottom>
      </fg-mainview>
    </fg-include>
  </body>
  <script src="scripts/genbox.js"></script>
  <script>
    const box = document.querySelector("#slot").genbox;

    const stages = [
      [0.06, "reading prompt"],
      [0.18, "seeding latents"],
      [0.44, "denoising · step 12/30"],
      [0.74, "denoising · step 26/30"],
      [0.92, "decoding vae"],
      [1.0, "upscaling"],
    ];

    let i = 0;

    function runAssetAnimation() {
      const grid = document.querySelector(".assetGrid");
      if (!grid) return;
      const items = Array.from(grid.children);
      const colStr = getComputedStyle(grid).gridTemplateColumns;
      const cols = colStr === "none" ? 1 : colStr.trim().split(/\s+/).length;
      const stagger = 55;
      items.forEach((item, i) => {
        const delay = (Math.floor(i / cols) + (i % cols)) * stagger;
        item.style.animationName = "assetFadeIn";
        item.style.animationDuration = "550ms";
        item.style.animationTimingFunction = "ease-out";
        item.style.animationFillMode = "both";
        item.style.animationDelay = delay + "ms";
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      // double rAF ensures layout is fully computed before reading grid columns
      requestAnimationFrame(() => requestAnimationFrame(runAssetAnimation));
    });
  </script>
</html>
