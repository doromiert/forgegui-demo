<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ForgeGUI Blog</title>
        <meta name="description" content="News and updates from ForgeGUI." />
        <meta name="theme-color" content="#0a0a0a" />
        <meta name="color-scheme" content="dark" />
        <link rel="stylesheet" href="styles/public.css" />
        <link rel="stylesheet" href="styles/blog.css" />
        <link rel="stylesheet" href="styles/landing-header.css" />
        <script src="scripts/site.js" defer></script>
        <script src="scripts/public-pages.js" defer></script>
    </head>
    <body class="publicPage">
        <fg-include data-template="templates/landing-header.html"></fg-include>
        <main class="publicSurface">
            <fg-include data-template="templates/public-hero.html">
                <span data-slot="title">Blog</span>
                <span data-slot="description">Learn about what’s going on inside ForgeGUI!</span>
                <img data-slot="mark" class="publicHeroMark" src="assets/landing/public-mark-blog.svg" alt="" />
            </fg-include>

            <section class="publicProductionEmpty" aria-labelledby="latest-news-title">
                <h2 id="latest-news-title">Product updates are coming soon.</h2>
                <p>Major ForgeGUI releases and engineering notes will be published here.</p>
            </section>
        </main>
    </body>
</html>
