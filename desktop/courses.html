<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ForgeGUI</title>
        <!--<link rel="icon" type="image/svg+xml" href="fg.svg" />-->
        <link rel="stylesheet" href="styles/base.css" />
        <link rel="stylesheet" href="styles/courses.css" />
        <script src="scripts/site.js" defer></script>
        <meta name="theme-color" content="#0D0D0D" />
        <meta name="description" content="ForgeGUI - Create anything with AI" />
        <meta property="og:title" content="ForgeGUI" />
        <meta
            property="og:description"
            content="Powerful AI tool for creators"
        />
        <meta property="og:type" content="website" />
        <meta name="color-scheme" content="dark" />

        <style></style>
    </head>

    <body class="chat">
        <fg-include data-template="templates/app-shell.html">
            <fg-mainview data-slot="content" class="courses">
                <fg-banner>
                    <h1>Courses</h1>
                    <span
                        >Learn how to build popular games using ForgeGUI.<br />
                        Exclusively taught by the <em class="goat">GOAT</em>, Guilio Greco.</span
                    >

                    <img src="assets/course-graph.svg" />
                </fg-banner>
                <fg-courseheader> Available Courses </fg-courseheader>
                <fg-coursegrid>
                    <fg-include data-template="templates/course.html"> </fg-include>
                    <fg-include data-template="templates/course.html"> </fg-include>
                    <fg-include data-template="templates/course.html"> </fg-include>
                    <fg-include data-template="templates/course.html"> </fg-include>
                    <fg-include data-template="templates/course.html"> </fg-include>
                    <fg-include data-template="templates/course.html"> </fg-include>
                    <fg-include data-template="templates/course.html"> </fg-include>
                    <fg-include data-template="templates/course.html"> </fg-include>
                    <fg-include data-template="templates/course.html"> </fg-include>
                </fg-coursegrid>
                <fg-completionbarbg>
                    <fg-completionbar>
                        <fg-meat> <b>25%</b><span>Complete</span> </fg-meat>
                    </fg-completionbar>
                </fg-completionbarbg>
            </fg-mainview>
        </fg-include>
    </body>
</html>
