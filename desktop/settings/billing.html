<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ForgeGUI — Settings</title>
        <link rel="stylesheet" href="styles/base.css" />
        <script src="scripts/site.js" defer></script>
        <meta name="theme-color" content="#0D0D0D" />
        <meta name="color-scheme" content="dark" />
        <style></style>
    </head>

    <body class="chat">
        <fg-include data-template="templates/settings-shell.html">
            <fg-settingsview data-slot="content">
                <div style="height: 90px"></div>
                <fg-include data-template="templates/listbox.html">
                    <span data-slot="header">Plan Overview</span>
                    <fg-include data-template="templates/listbox-row.html">
                        <span data-slot="label">Selected Plan</span>
                        <b data-slot="value" data-settings-plan>Loading...</b>
                        <button data-slot="action" class="listboxAction" type="button" data-settings-plans>
                            Change Plan
                        </button>
                    </fg-include>
                    <fg-include data-template="templates/listbox-row.html">
                        <span data-slot="label">Credits Available</span>
                        <b data-slot="value" data-settings-credits>Loading...</b>
                        <button data-slot="action" class="listboxAction" type="button" data-settings-plans>
                            Add Credits
                        </button>
                    </fg-include>
                    <fg-include data-template="templates/listbox-row.html">
                        <span data-slot="label">Billing Status</span>
                        <b data-slot="value" data-settings-subscription>Loading...</b>
                        <button data-slot="action" class="listboxAction" type="button" data-settings-billing-portal>
                            Manage Billing
                        </button>
                    </fg-include>
                </fg-include>
            </fg-settingsview>
        </fg-include>
    </body>
</html>
