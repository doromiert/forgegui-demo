<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ForgeGUI</title>
        <!--<link rel="icon" type="image/svg+xml" href="fg.svg" />-->
        <link rel="stylesheet" href="base.css" />
        <link rel="stylesheet" href="game-maker.css" />
        <script src="site.js" defer></script>
        <meta name="theme-color" content="#0D0D0D" />
        <meta name="description" content="ForgeGUI - Create anything with AI" />
        <meta property="og:title" content="ForgeGUI" />
        <meta
            property="og:description"
            content="Powerful AI tool for creators"
        />
        <meta property="og:type" content="website" />
        <meta name="color-scheme" content="dark" />

        <style>
            /* page-local: pin the 3D viewport to the mainView box */
            fg-mainview#gameGenerator {
                position: relative;
                overflow: hidden;
            }
            fg-mainview#gameGenerator > canvas {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                display: block;
                cursor: default;
            }
            /* orbit is middle-drag only, so `grabbing` shows only during one */
            fg-mainview#gameGenerator > canvas.dragging {
                cursor: grabbing;
            }
            /* hovering a clickable object: reachable vs out of range */
            fg-mainview#gameGenerator > canvas.hover-click {
                cursor: pointer;
            }
            fg-mainview#gameGenerator > canvas.hover-far {
                cursor: not-allowed;
            }
            fg-mainview#gameGenerator > canvas.dragging.hover-click,
            fg-mainview#gameGenerator > canvas.dragging.hover-far {
                cursor: grabbing;
            }
            fg-mainview#gameGenerator.dropping::after {
                content: "Drop a .forge.json to load it";
                position: absolute;
                inset: 12px;
                border: 2px dashed #67f5d2;
                border-radius: 22px;
                background: rgba(12, 12, 12, 0.6);
                color: #67f5d2;
                font-family: "Atkinson Hyperlegible Next";
                font-size: 20px;
                font-weight: 700;
                display: grid;
                place-items: center;
                pointer-events: none;
                z-index: 3000;
            }
            fg-mainview#gameGenerator fg-chrome {
                position: relative;
                pointer-events: none;
            }
            fg-mainview#gameGenerator fg-chrome > * {
                pointer-events: auto;
            }
            /* the HUD/convo row must not swallow drags meant for the canvas */
            fg-mainview#gameGenerator fg-mainviewtop {
                pointer-events: none;
                justify-content: space-between;
            }
            fg-mainview#gameGenerator fg-mainviewtop > * {
                pointer-events: auto;
            }
            fg-mainview#gameGenerator > fg-chrome > fg-bottom {
                display: flex;
                flex-direction: column;
                align-self: stretch;
                gap: 8px;
            }

            fg-devrow {
                display: flex;
                gap: 8px;
                align-items: center;
                align-self: stretch;
            }
            fg-devrow #token {
                flex: 1 0 0;
                min-width: 0;
            }
            fg-devrow button {
                flex: none;
                padding: 10px 14px;
                border-radius: 12px;
                border: 1px solid #464646;
                background: #1b1b1b;
                color: #fff;
                font-family: "Atkinson Hyperlegible Next";
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
            }
            fg-devrow button:hover {
                background: #262626;
            }
            fg-devrow button.destructive {
                border-color: rgba(255, 168, 168, 0.24);
                color: #ff9d9d;
                background: rgba(255, 0, 0, 0.08);
            }
            fg-devrow button.destructive:hover {
                background: rgba(255, 0, 0, 0.16);
            }
            fg-devrow button.destructive.armed {
                background: #e2384a;
                border-color: #e2384a;
                color: #fff;
            }

            fg-gamehud {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
                padding: 14px 18px;
                border-radius: 20px;
                border: 1px solid #464646;
                background: rgba(12, 12, 12, 0.72);
                backdrop-filter: blur(14px);
                font-family: "Atkinson Hyperlegible Next";
                color: #fff;
                text-align: left;
                align-self: flex-start;
                min-width: 210px;
                max-width: 320px;
            }
            fg-gamehud fg-hudtitle {
                font-size: 18px;
                font-weight: 700;
                line-height: 1.2;
            }
            fg-gamehud fg-hudrow {
                font-size: 15px;
                font-weight: 500;
                opacity: 0.85;
                line-height: 1.35;
            }
            fg-gamehud fg-hudrow b {
                font-weight: 700;
                opacity: 1;
            }
            fg-gamehud fg-hudkeys {
                font-size: 12px;
                opacity: 0.5;
                margin-top: 4px;
                line-height: 1.5;
            }

            /* ── Roblox-style hotbar + backpack ─────────────────────────
               Both sit in <fg-chrome>'s flex column between the viewport row and
               the chatbox, so they stack above it without a magic offset. */
            fg-gamehotbar {
                display: flex;
                align-self: center;
                margin-bottom: 10px;
                gap: 8px;
                padding: 8px;
                border-radius: 18px;
                border: 1px solid #464646;
                background: rgba(12, 12, 12, 0.72);
                backdrop-filter: blur(14px);
                z-index: 1500;
                pointer-events: auto;
            }
            fg-gamehotbar.hidden,
            fg-gamebackpack.hidden {
                display: none;
            }
            fg-gamehotbar fg-itemslot,
            fg-gamebackpack fg-itemslot {
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 4px;
                width: 66px;
                height: 66px;
                border-radius: 13px;
                border: 1px solid #3a3a3a;
                background: #171717;
                cursor: pointer;
                font-family: "Atkinson Hyperlegible Next";
                color: #fff;
                transition:
                    border-color 0.12s ease,
                    transform 0.12s ease;
            }
            fg-gamehotbar fg-itemslot:hover,
            fg-gamebackpack fg-itemslot:hover {
                border-color: #6a6a6a;
                transform: translateY(-2px);
            }
            fg-gamehotbar fg-itemslot.empty {
                cursor: default;
                opacity: 0.35;
            }
            fg-gamehotbar fg-itemslot.empty:hover {
                transform: none;
                border-color: #3a3a3a;
            }
            fg-gamehotbar fg-itemslot.equipped {
                border-color: #67f5d2;
                box-shadow: 0 0 0 2px rgba(103, 245, 210, 0.28);
                background: #10201d;
            }
            fg-gamehotbar fg-itemkey {
                position: absolute;
                top: 3px;
                left: 6px;
                font-size: 11px;
                opacity: 0.45;
                font-weight: 700;
            }
            fg-gamehotbar fg-itemface,
            fg-gamebackpack fg-itemface {
                width: 26px;
                height: 26px;
                border-radius: 7px;
                display: grid;
                place-items: center;
                font-size: 20px;
                line-height: 1;
            }
            fg-gamehotbar fg-itemface.emoji,
            fg-gamebackpack fg-itemface.emoji {
                background: none;
            }
            fg-gamehotbar fg-itemlabel,
            fg-gamebackpack fg-itemlabel {
                font-size: 10px;
                font-weight: 600;
                max-width: 58px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                opacity: 0.8;
            }
            fg-gamehotbar fg-itemcount,
            fg-gamebackpack fg-itemcount {
                position: absolute;
                right: 5px;
                bottom: 4px;
                font-size: 11px;
                font-weight: 700;
                color: #ffd23f;
            }
            fg-gamehotbar fg-bagbutton {
                position: relative;
                display: grid;
                place-items: center;
                width: 66px;
                height: 66px;
                border-radius: 13px;
                border: 1px solid #3a3a3a;
                background: #171717;
                cursor: pointer;
                font-size: 24px;
            }
            fg-gamehotbar fg-bagbutton:hover {
                border-color: #6a6a6a;
            }

            fg-gamebackpack {
                display: flex;
                align-self: center;
                margin-bottom: 10px;
                flex-direction: column;
                gap: 10px;
                padding: 14px;
                max-width: 640px;
                border-radius: 20px;
                border: 1px solid #464646;
                background: rgba(12, 12, 12, 0.86);
                backdrop-filter: blur(18px);
                z-index: 1500;
                pointer-events: auto;
            }
            fg-gamebackpack fg-bagtitle {
                font-family: "Atkinson Hyperlegible Next";
                font-size: 15px;
                font-weight: 700;
                color: #fff;
                opacity: 0.75;
            }
            fg-gamebackpack fg-baggrid {
                display: grid;
                grid-template-columns: repeat(auto-fill, 66px);
                gap: 8px;
            }

            /* ── dev tuning panel ─────────────────────────────────────── */
            fg-devtuner {
                position: absolute;
                top: 16px;
                right: 16px;
                width: 290px;
                max-height: calc(100% - 32px);
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                gap: 2px;
                padding: 12px;
                border-radius: 18px;
                border: 1px solid #464646;
                background: rgba(10, 10, 10, 0.9);
                backdrop-filter: blur(18px);
                font-family: "Atkinson Hyperlegible Next";
                color: #fff;
                z-index: 2500;
                pointer-events: auto;
            }
            fg-devtuner.hidden {
                display: none;
            }
            fg-devtuner fg-tunehead {
                display: flex;
                align-items: center;
                justify-content: space-between;
                font-size: 15px;
                font-weight: 700;
                padding-bottom: 8px;
                margin-bottom: 4px;
                border-bottom: 1px solid #2a2a2a;
            }
            fg-devtuner fg-tuneactions {
                display: flex;
                gap: 6px;
            }
            fg-devtuner fg-tuneactions button {
                padding: 3px 8px;
                border-radius: 8px;
                border: 1px solid #3a3a3a;
                background: #1b1b1b;
                color: #bbb;
                font-family: inherit;
                font-size: 11px;
                font-weight: 600;
                cursor: pointer;
            }
            fg-devtuner fg-tuneactions button:hover {
                background: #292929;
                color: #fff;
            }
            fg-devtuner fg-tunegroup {
                display: flex;
                flex-direction: column;
                gap: 2px;
                margin-top: 8px;
            }
            fg-devtuner fg-tunegroup h {
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                opacity: 0.45;
                margin-bottom: 2px;
            }
            fg-devtuner fg-tunerow {
                display: grid;
                grid-template-columns: 1fr auto 44px;
                align-items: center;
                gap: 8px;
                padding: 2px 0;
            }
            fg-devtuner fg-tunerow:has(.autoBox) {
                grid-template-columns: 1fr auto auto 44px;
            }
            fg-devtuner fg-tunerow label {
                font-size: 12px;
                opacity: 0.8;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            fg-devtuner fg-tunerow fg-tunevalue {
                font-size: 11px;
                font-variant-numeric: tabular-nums;
                text-align: right;
                opacity: 0.65;
            }
            fg-devtuner input[type="range"] {
                width: 96px;
                accent-color: #67f5d2;
                cursor: pointer;
            }
            fg-devtuner input[type="range"]:disabled {
                opacity: 0.3;
                cursor: default;
            }
            fg-devtuner input[type="checkbox"] {
                accent-color: #67f5d2;
                cursor: pointer;
            }

            fg-gametoast {
                position: absolute;
                left: 50%;
                top: 24px;
                transform: translateX(-50%);
                padding: 10px 20px;
                border-radius: 999px;
                border: 1px solid #464646;
                background: rgba(12, 12, 12, 0.85);
                backdrop-filter: blur(14px);
                color: #fff;
                font-family: "Atkinson Hyperlegible Next";
                font-size: 16px;
                font-weight: 600;
                pointer-events: none;
                opacity: 0;
                transition: opacity 0.25s ease;
                z-index: 2000;
                max-width: 70%;
                text-align: center;
            }
            fg-gametoast.show {
                opacity: 1;
            }
            fg-gametoast.error {
                border-color: #7a2f2f;
                color: #ff9d9d;
            }

            fg-message code.buildChip {
                display: inline-block;
                margin-top: 6px;
                padding: 2px 10px;
                border-radius: 999px;
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.14);
                font-size: 13px;
                opacity: 0.85;
            }
            fg-message code.buildChip.bad {
                background: rgba(255, 77, 94, 0.12);
                border-color: #7a2f2f;
                color: #ff9d9d;
            }

            /* "Thinking..." — shown until the first prose token arrives */
            fg-message fg-thinking {
                display: inline;
                opacity: 0.6;
                font-style: italic;
            }
            fg-message fg-thinking fg-dot {
                animation: forgeThinkingDot 1.2s infinite;
            }
            fg-message fg-thinking fg-dot:nth-child(2) {
                animation-delay: 0.2s;
            }
            fg-message fg-thinking fg-dot:nth-child(3) {
                animation-delay: 0.4s;
            }
            @keyframes forgeThinkingDot {
                0%,
                60%,
                100% {
                    opacity: 0.25;
                }
                30% {
                    opacity: 1;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                fg-message fg-thinking fg-dot {
                    animation: none;
                }
            }

            /* the Create button becomes Cancel while a request is in flight */
            fg-chatbox .chatboxButton.send.busy {
                background: #e2384a;
            }
            fg-chatbox .chatboxButton.send.busy img {
                display: none;
            }
            fg-chatbox .chatboxButton.send.busy::after {
                content: "";
                width: 14px;
                height: 14px;
                border-radius: 3px;
                background: #fff;
            }
        </style>
    </head>

    <body class="chat">
        <fg-include data-template="templates/app-shell.html">
            <fg-mainview data-slot="content" id="gameGenerator">
                <fg-chrome>
                    <fg-mainviewtop>
                        <fg-gamehud id="hud"></fg-gamehud>
                        <fg-chatcontainer class="convo">
                            <fg-top>
                                <img src="icons/message.svg" />
                                <span>Conversation</span>
                            </fg-top>
                            <fg-bottom class="convo" id="convo"></fg-bottom>
                        </fg-chatcontainer>
                    </fg-mainviewtop>
                    <fg-gamebackpack id="backpack" class="hidden"></fg-gamebackpack>
                    <fg-gamehotbar id="hotbar" class="hidden"></fg-gamehotbar>
                    <fg-bottom>
                        <fg-devrow>
                            <input
                                id="token"
                                placeholder="DEV: openrouter API key"
                            />
                            <button id="devTuneButton">DEV: tune</button>
                            <button id="devExportButton">DEV: export</button>
                            <button id="devImportButton">DEV: import</button>
                            <button id="devClearButton" class="destructive">
                                DEV: clear
                            </button>
                            <input
                                id="devImportFile"
                                type="file"
                                accept=".json,application/json"
                                hidden
                            />
                        </fg-devrow>
                        <fg-include data-template="templates/chatbox.html"></fg-include>
                    </fg-bottom>
                </fg-chrome>
                <fg-devtuner id="tuner" class="hidden"></fg-devtuner>
                <fg-gametoast id="toast"></fg-gametoast>
            </fg-mainview>
        </fg-include>
    </body>

    <script src="https://www.threejs.pro/build/three.js"></script>
    <script src="forge-engine.js"></script>
    <script src="forge-editor.js"></script>
</html>
