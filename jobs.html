<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Available Jobs - ForgeGUI</title>
        <meta name="description" content="Open roles at ForgeGUI." />
        <meta name="theme-color" content="#0a0a0a" />
        <meta name="color-scheme" content="dark" />
        <link rel="stylesheet" href="public.css" />
        <link rel="stylesheet" href="jobs.css" />
        <script src="site.js" defer></script>
        <script src="public-pages.js" defer></script>
    </head>
    <body class="publicPage">
        <fg-include data-template="templates/public-header.html"></fg-include>
        <main class="publicSurface jobsSurface">
            <fg-include data-template="templates/public-hero.html">
                <span data-slot="title">Available Jobs</span>
                <span data-slot="description">ForgeGUI needs your talent! We’re always open to hiring new people to make<br />ForgeGUI even better.</span>
                <img data-slot="mark" class="publicHeroMark" src="landing-assets/public-mark-jobs.svg" alt="" />
            </fg-include>

            <section class="jobsListing" aria-labelledby="open-jobs-title">
                <div class="jobsToolbar">
                    <h2 id="open-jobs-title">Open Jobs</h2>
                    <div class="jobFilters">
                        <label>Pay Range: <select data-job-filter="pay"><option value="any">Any</option></select></label>
                        <label>Category: <select data-job-filter="category"><option value="any">Any</option></select></label>
                        <label>Style: <select data-job-filter="style"><option value="virtual">Virtual</option><option value="any">Any</option></select></label>
                        <label class="publicSearch jobSearch">
                            <img src="icons/search.svg" alt="" />
                            <span class="visually-hidden">Search jobs</span>
                            <input type="search" placeholder="Search Jobs" data-list-search data-list-target="jobs-grid" />
                        </label>
                    </div>
                </div>
                <div class="jobsGrid" id="jobs-grid">
                    <fg-include data-template="templates/job-card.html"></fg-include>
                    <fg-include data-template="templates/job-card.html"></fg-include>
                    <fg-include data-template="templates/job-card.html"></fg-include>
                    <fg-include data-template="templates/job-card.html"></fg-include>
                    <fg-include data-template="templates/job-card.html"></fg-include>
                    <fg-include data-template="templates/job-card.html"></fg-include>
                    <fg-include data-template="templates/job-card.html"></fg-include>
                    <fg-include data-template="templates/job-card.html"></fg-include>
                    <fg-include data-template="templates/job-card.html"></fg-include>
                    <fg-include data-template="templates/job-card.html"></fg-include>
                    <fg-include data-template="templates/job-card.html"></fg-include>
                    <fg-include data-template="templates/job-card.html"></fg-include>
                    <fg-include data-template="templates/job-card.html"></fg-include>
                    <fg-include data-template="templates/job-card.html"></fg-include>
                    <fg-include data-template="templates/job-card.html"></fg-include>
                </div>
                <p class="publicEmptyFilter" data-list-empty hidden>No jobs match your filters.</p>
            </section>
        </main>

        <fg-popupcontainer class="hidden">
            <fg-popup id="job-detail" class="jobDetailPopup hidden" aria-label="Job details">
                <fg-include data-template="templates/job-detail-content.html"></fg-include>
            </fg-popup>
        </fg-popupcontainer>
    </body>
</html>
