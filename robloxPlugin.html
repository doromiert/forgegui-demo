<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ForgeGUI Connect</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&display=swap");

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Atkinson Hyperlegible Next", sans-serif;
    }

    body {
      background-color: #0d0d0d;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0 10px 10px 10px;
      gap: 0;
    }

    /* ── top status bar ── */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px 20px;
      flex-shrink: 0;
    }

    .status-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #11fa97;
      box-shadow: 0 0 6px 1px rgba(17, 250, 151, 0.55);
      flex-shrink: 0;
    }

    .status-label {
      font-size: 24px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      line-height: 1;
    }

    /* ── main card ── */
    .card {
      flex: 1 0 0;
      background-color: #171717;
      border-radius: 20px;
      outline: 1px solid rgba(255, 255, 255, 0.1);
      outline-offset: -1px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 55px 20px 20px;
      min-height: 0;
    }

    /* ── top section: logo + title + project ── */
    .card-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }

    .logo-wrap {
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .logo-wrap svg {
      width: 118.75px;
      height: 100px;
    }

    .title {
      font-size: 40px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      line-height: 1;
      text-align: center;
    }

    .title .dim {
      font-weight: 400;
      color: rgba(255, 255, 255, 0.7);
    }

    .project-name {
      font-size: 24px;
      font-weight: 500;
      color: #fff;
      white-space: nowrap;
      text-align: center;
    }

    /* ── bottom section: email + button ── */
    .card-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      width: 100%;
    }

    .user-email {
      font-size: 24px;
      font-weight: 500;
      color: #fff;
      text-align: center;
      white-space: nowrap;
    }

    /* button */
    .btn-disconnect {
      position: relative;
      width: 100%;
      height: 50px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 20px 19px;
      background: #fff;
      transition: filter 0.15s, transform 0.1s;
    }

    .btn-disconnect::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0px -3px 2px 0px rgba(0, 0, 0, 0.3);
      pointer-events: none;
    }

    .btn-disconnect span {
      font-size: 22px;
      font-weight: 600;
      color: #000;
      white-space: nowrap;
      line-height: 1;
      position: relative;
    }

    .btn-disconnect:hover {
      filter: brightness(0.93);
    }

    .btn-disconnect:active {
      filter: brightness(0.85);
      transform: scale(0.985);
    }

    /* ── disconnected state ── */
    body.disconnected .status-dot {
      background: rgba(255, 255, 255, 0.25);
      box-shadow: none;
    }

    .subtitle {
      font-size: 24px;
      font-weight: 500;
      color: #fff;
      text-align: center;
      line-height: 1.4;
      max-width: 350px;
    }
  </style>
</head>
<body>

  <div class="status-bar">
    <div class="status-dot"></div>
    <span class="status-label">Connected</span>
  </div>

  <div class="card">
    <div class="card-top">

      <div class="logo-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <path d="M43.629 21.872V11.5211C43.629 11.0492 43.2465 10.6667 42.7746 10.6667H8.85441C8.38253 10.6667 8 11.0492 8 11.5211V36.316C8 36.7879 8.38253 37.1704 8.85441 37.1704H19.7339C20.2058 37.1704 20.5883 36.7879 20.5883 36.316V23.5808C20.5883 23.109 20.9709 22.7264 21.4428 22.7264H42.7746C43.2465 22.7264 43.629 22.3439 43.629 21.872Z" fill="white"/>
  <path d="M58.6667 37.8963V27.6285C58.6667 27.1566 58.2841 26.7741 57.8123 26.7741H24.0345C23.5626 26.7741 23.1801 27.1566 23.1801 27.6285V52.4789C23.1801 52.9508 23.5626 53.3333 24.0345 53.3333H34.8286C35.3004 53.3333 35.683 52.9508 35.683 52.4789V39.6051C35.683 39.1332 36.0655 38.7507 36.5374 38.7507H57.8123C58.2841 38.7507 58.6667 38.3682 58.6667 37.8963Z" fill="white"/>
</svg>
      </div>

      <p class="title">ForgeGUI <span class="dim">Connect</span></p>
      <p class="project-name">'Racing Game Project'</p>
    </div>

    <div class="card-bottom" id="card-bottom">
      <p class="user-email">user@email.com</p>
      <button class="btn-disconnect" type="button" onclick="toggleConnection()">
        <span>Disconnect</span>
      </button>
    </div>
  </div>

  <script>
    let connected = true;

    const connectedBottom = `
      <p class="user-email">user@email.com</p>
      <button class="btn-disconnect" type="button" onclick="toggleConnection()">
        <span>Disconnect</span>
      </button>`;

    const disconnectedBottom = `
      <button class="btn-disconnect" type="button" onclick="toggleConnection()">
        <span>Link Account</span>
      </button>`;

    const connectedTop = `'Racing Game Project'`;
    const disconnectedTop = `Link your Roblox Account to ForgeGUI to get started.`;

    function toggleConnection() {
      connected = !connected;
      document.body.classList.toggle("disconnected", !connected);
      document.querySelector(".status-label").textContent = connected ? "Connected" : "Disconnected";
      document.querySelector(".project-name").textContent = connected ? connectedTop : disconnectedTop;
      document.getElementById("card-bottom").innerHTML = connected ? connectedBottom : disconnectedBottom;
    }
  </script>
</body>
</html>
