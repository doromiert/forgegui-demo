name: Publish static site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-static-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static artifact
        run: node tools/site.mjs build dist
        env:
          FORGE_SUPABASE_URL: ${{ vars.FORGE_SUPABASE_URL }}
          FORGE_SUPABASE_ANON_KEY: ${{ vars.FORGE_SUPABASE_ANON_KEY }}

      - name: Publish public branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: public
          publish_dir: ./dist
          force_orphan: true
          cname: forgegui.com
